services:
  api:
    build: .
    depends_on:
      - mlflow
      - mysql
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:8080, localhost:8080" # Pour autoriser les connexions depuis l'API en local et la connexion à l'interface depuis le navigateur
    command: >
      mlflow server
      --host 0.0.0.0
      --port 8080
      --backend-store-uri sqlite:////mlflow_db/mlflow.db
      --artifacts-destination /mlflow_artifacts
      --serve-artifacts
    ports:
      - "8080:8080"
    volumes:
      - ./mlflow_data:/mlflow_artifacts
      - ./mlflow_db:/mlflow_db

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reco_films
      MYSQL_USER: reco_user
      MYSQL_PASSWORD: reco_user
    ports:
      - "3307:3306" # on expose sur 3307 pour éviter le conflit avec 3306 utilisé pour mysql local
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./src/etl/create_db.sql:/docker-entrypoint-initdb.d/01_create_db.sql:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deployment/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: always

  # service Grafana:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: always

    # service node_exporter:
  node-exporter:
      image: prom/node-exporter:latest
      container_name: node-exporter
      ports:
        - "9100:9100"
        # C'est sur ce port que Prometheus viendra "scraper" les métriques système.
      volumes:
        - /proc:/host/proc:ro
        # Le répertoire '/proc' contient des informations vitales sur l'état du noyau Linux et des processus en cours (utilisation CPU par process, infos mémoire, etc.).
        - /sys:/host/sys:ro
        # Le répertoire '/sys' expose des informations sur les périphériques matériels et les configurations du noyau.
        - /:/rootfs:ro
        # C'est essentiel pour que Node Exporter puisse accéder aux informations sur l'utilisation de l'espace disque de l'hôte.
      command:
      # Ces commandes indiquent à Node Exporter où trouver les systèmes de fichiers de l'hôte que nous venons de monter via les volumes.
        - '--path.procfs=/host/proc'
        - '--path.sysfs=/host/sys'
        - '--path.rootfs=/rootfs'
        - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/run/docker/netns/.+)$'
      restart: always
    
volumes:
  prometheus_data: {}
  grafana_data: {}
    