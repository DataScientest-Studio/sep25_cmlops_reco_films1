    global:
      scrape_interval: 5s # Fréquence à laquelle Prometheus va scraper les métriques
      evaluation_interval: 5s # Fréquence à laquelle les règles d'alerte sont évaluées

    rule_files:
      - "rules/*.yml"
      
    scrape_configs:
    # monitoring de l'api sur 8000
      - job_name: 'api' 
        static_configs:
          - targets: ['api:8000'] 
    # monitoring du node-exporter sur 9100
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']